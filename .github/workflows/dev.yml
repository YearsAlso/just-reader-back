name: Dev Branch CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn clean install -B

      - name: Run tests
        run: mvn test -B

      - name: Code Quality Check
        run: mvn checkstyle:check

      - name: Dependency Vulnerability Check
        run: mvn org.owasp:dependency-check-maven:check

      # 确保所有微服务的 JAR 包都已打包完成
      - name: Package All Services
        run: |
          mvn clean package -DskipTests -B
          echo "JAR packaging completed for all services"

      # 设置环境变量
      - name: Set up environment variables
        run: |
          echo "IMG_VERSION=latest" >> $GITHUB_ENV
          # 或者使用 git commit hash 作为版本号
          # echo "IMG_VERSION=${{ github.sha }}" >> $GITHUB_ENV

      # 构建 Docker 镜像
      - name: Build Docker Images with docker-compose
        run: |
          echo "Building Docker images..."
          docker-compose -f docker-compose.yml build
          echo "Docker images build completed"

      # 可选：显示构建的镜像
      - name: List Docker Images
        run: docker images | grep just-reader

      # 可选：如果需要推送到镜像仓库
      # - name: Login to Aliyun Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: registry.cn-hangzhou.aliyuncs.com
      #     username: ${{ secrets.ALIYUN_USERNAME }}
      #     password: ${{ secrets.ALIYUN_PASSWORD }}

      # - name: Push Docker Images
      #   run: |
      #     docker-compose -f docker-compose.yml push