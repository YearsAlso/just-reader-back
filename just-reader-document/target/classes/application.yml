# 文档上传服务配置
server:
  port: 8083
  servlet:
    context-path: /document

spring:
  application:
    name: just-reader-document
  
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB
      enabled: true
  
  # 使用H2内存数据库避免依赖问题
  datasource:
    url: jdbc:h2:mem:justreader;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: true
      path: /h2-console

# 文档上传配置
document:
  upload:
    max-file-size: 104857600  # 100MB
    chunk-size: 5242880       # 5MB
    temp-dir: /tmp/just-reader/uploads
    storage-dir: /data/just-reader/documents
    max-concurrent-uploads: 5
    chunked-upload-enabled: true
    chunked-upload-expiry-minutes: 60
    validation-enabled: true
    virus-scan-enabled: false
    auto-parse-enabled: true
    parse-timeout-seconds: 300
    supported-types:
      - application/pdf
      - application/epub+zip
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain
      - application/msword
    supported-extensions:
      - .pdf
      - .epub
      - .docx
      - .doc
      - .txt

# 日志配置
logging:
  level:
    com.yearsalso.document: DEBUG
    org.springframework.web: INFO
  file:
    name: logs/document-service.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Swagger配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha